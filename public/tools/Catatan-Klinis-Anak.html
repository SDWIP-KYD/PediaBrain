<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0f2a4a">
<title>Catatan Klinis Dokter Anak</title>
<style>
:root{
  --navy:#0f2a4a; --navy-2:#16385f; --navy-3:#1d4574;
  --blue:#2563a8; --blue-soft:#3b7dc4;
  --sky:#eef4fb; --sky-2:#e0ebf8; --sky-line:#cfe0f3;
  --ink:#152233; --muted:#5d6f86; --muted-2:#8497ac;
  --bg:#ffffff; --card:#ffffff; --field:#f4f8fd;
  --warn-bg:#fff6e6; --warn-line:#f0c873; --warn-ink:#8a5a00;
  --ok-bg:#e8f6ee; --ok-line:#9bd4b2; --ok-ink:#16633b;
  --shadow:0 1px 2px rgba(15,42,74,.06),0 8px 24px rgba(15,42,74,.08);
  --shadow-sm:0 1px 2px rgba(15,42,74,.08);
  --r:16px; --r-sm:11px;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 96px}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(165deg,var(--navy) 0%,var(--navy-3) 100%);
  color:#fff;box-shadow:0 6px 22px rgba(15,42,74,.22);
}
.head-inner{max-width:880px;margin:0 auto;padding:14px 16px 16px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.logo{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
}
.logo svg{width:22px;height:22px}
.brand h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:.2px;line-height:1.15}
.brand p{margin:1px 0 0;font-size:11.5px;color:rgba(255,255,255,.72);letter-spacing:.3px}
.search-box{position:relative;margin-top:13px}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.5}
#q{
  width:100%;padding:12px 38px 12px 40px;border:none;border-radius:12px;
  font-size:15px;font-family:var(--sans);background:#fff;color:var(--ink);
  box-shadow:0 3px 10px rgba(0,0,0,.12);
}
#q::placeholder{color:#9bacc2}
#q:focus{outline:2px solid var(--blue-soft);outline-offset:1px}
.clearq{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:none;background:#e7eef7;color:#5d6f86;width:26px;height:26px;border-radius:50%;
  font-size:16px;line-height:1;cursor:pointer;display:none}
.clearq.show{display:block}

/* ---------- Section title ---------- */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);margin:26px 2px 12px}
.hello{margin:22px 2px 4px}
.hello .k{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--navy)}
.hello .s{font-size:13.5px;color:var(--muted);margin-top:2px}

/* ---------- Division grid ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.dcard{
  position:relative;background:var(--card);border:1px solid var(--sky-line);border-radius:var(--r);
  padding:15px 14px 14px;cursor:pointer;transition:.16s;box-shadow:var(--shadow-sm);overflow:hidden;
}
.dcard:active{transform:scale(.975)}
.dcard:hover{border-color:var(--blue-soft);box-shadow:var(--shadow)}
.dcard .num{
  position:absolute;top:10px;right:12px;font-family:var(--serif);font-size:30px;font-weight:700;
  color:var(--sky-2);line-height:1
}
.dcard .ic{width:36px;height:36px;border-radius:10px;background:var(--sky);display:flex;align-items:center;justify-content:center;margin-bottom:30px}
.dcard .ic svg{width:21px;height:21px;color:var(--blue)}
.dcard h3{margin:0;font-size:15px;font-weight:700;color:var(--navy);line-height:1.2}
.dcard .full{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.dcard .cnt{margin-top:7px;font-size:11px;color:var(--blue);font-weight:600}

/* feature tile (kalkulator) */
.tile{
  display:flex;align-items:center;gap:13px;background:linear-gradient(120deg,var(--navy) 0%,var(--blue) 130%);
  color:#fff;border-radius:var(--r);padding:15px 16px;cursor:pointer;transition:.16s;
  box-shadow:0 8px 22px rgba(20,49,95,.28);margin-bottom:6px
}
.tile:active{transform:scale(.985)}
.tile .ti{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.tile .ti svg{width:23px;height:23px}
.tile h3{margin:0;font-size:16px;font-weight:700}
.tile p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.82)}
.tile .arr{margin-left:auto;opacity:.8}

/* ---------- Back bar ---------- */
.back{display:inline-flex;align-items:center;gap:7px;margin:18px 0 4px;color:var(--blue);
  background:none;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);padding:6px 2px}
.back svg{width:17px;height:17px}
.dhead{margin:6px 2px 8px}
.dhead .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:#fff;background:var(--blue);padding:3px 9px;border-radius:20px}
.dhead h2{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--navy);margin:10px 0 2px;line-height:1.15}
.dhead .full{font-size:13px;color:var(--muted);margin:0}

/* ---------- Section accordion ---------- */
.sec{background:var(--card);border:1px solid var(--sky-line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm)}
.sec-h{display:flex;align-items:center;gap:10px;padding:14px 15px;cursor:pointer;user-select:none}
.sec-h .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:0 0 7px}
.sec-h h4{margin:0;font-size:15px;font-weight:700;color:var(--navy);flex:1;line-height:1.3}
.sec-h .chev{width:20px;height:20px;color:var(--muted-2);transition:transform .22s;flex:0 0 20px}
.sec.open .sec-h .chev{transform:rotate(180deg)}
.sec-b{display:none;padding:2px 15px 16px}
.sec.open .sec-b{display:block}
.sec.open .sec-h h4{color:var(--blue)}

/* content blocks */
.blk{margin:11px 0 0}
.blk:first-child{margin-top:6px}
.sub{font-size:12.5px;font-weight:700;color:var(--navy-3);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 2px}
p.txt{margin:0;font-size:14.5px;color:var(--ink)}
ul.lst{margin:4px 0 0;padding-left:2px;list-style:none}
ul.lst li{position:relative;padding-left:18px;font-size:14.5px;margin:5px 0;color:var(--ink)}
ul.lst li::before{content:"";position:absolute;left:3px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--blue-soft)}
.formula{background:var(--sky);border:1px solid var(--sky-line);border-left:3px solid var(--blue);
  border-radius:8px;padding:9px 12px;font-size:14px;color:var(--navy-2);margin:8px 0 0;
  font-variant-numeric:tabular-nums}
.formula b{color:var(--navy)}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:10px 12px 10px 36px;
  position:relative;font-size:13.5px;color:var(--warn-ink);margin:9px 0 0;line-height:1.45}
.warn::before{content:"⚠";position:absolute;left:12px;top:9px;font-size:15px}
.note{font-size:13px;color:var(--muted);margin:7px 0 0;font-style:italic}

/* table */
.tw{overflow-x:auto;margin:9px 0 0;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--sky-line)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:100%}
thead th{background:var(--navy);color:#fff;text-align:left;padding:9px 11px;font-weight:600;white-space:nowrap;font-size:12.5px}
tbody td{padding:9px 11px;border-top:1px solid var(--sky-line);vertical-align:top;color:var(--ink)}
tbody tr:nth-child(even) td{background:var(--sky)}
tbody td:first-child{font-weight:600;color:var(--navy-2)}

/* ---------- Search results ---------- */
.rescount{font-size:13px;color:var(--muted);margin:16px 2px 8px}
.rescard{background:var(--card);border:1px solid var(--sky-line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.14s}
.rescard:active{transform:scale(.985)}
.rescard:hover{border-color:var(--blue-soft)}
.rescard .d{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--blue)}
.rescard h4{margin:3px 0 3px;font-size:15px;color:var(--navy);font-weight:700}
.rescard p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:#ffe9a8;color:inherit;padding:0 1px;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14.5px}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:10px}

/* ---------- Calculator ---------- */
.calc-cat{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);margin:18px 2px 8px}
.calc-li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--sky-line);
  border-radius:var(--r-sm);padding:13px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow-sm);transition:.14s}
.calc-li:active{transform:scale(.985)}
.calc-li:hover{border-color:var(--blue-soft)}
.calc-li .ci{width:34px;height:34px;border-radius:9px;background:var(--sky);display:flex;align-items:center;justify-content:center;flex:0 0 34px;font-weight:800;color:var(--blue);font-size:15px}
.calc-li h4{margin:0;font-size:14.5px;color:var(--navy);font-weight:700}
.calc-li p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.calc-li .arr{margin-left:auto;color:var(--muted-2)}

.calc-card{background:var(--card);border:1px solid var(--sky-line);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shadow);margin-top:6px}
.calc-card h3{font-family:var(--serif);font-size:20px;color:var(--navy);margin:0 0 3px}
.calc-card .desc{font-size:13px;color:var(--muted);margin:0 0 15px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--navy-2);margin-bottom:5px}
.field .unit{color:var(--muted);font-weight:400}
.field input,.field select{
  width:100%;padding:11px 12px;border:1.5px solid var(--sky-line);border-radius:10px;
  font-size:16px;font-family:var(--sans);background:var(--field);color:var(--ink)
}
.field input:focus,.field select:focus{outline:none;border-color:var(--blue);background:#fff}
.result{margin-top:6px;background:linear-gradient(120deg,var(--navy),var(--navy-3));color:#fff;
  border-radius:12px;padding:15px 16px}
.result .rl{font-size:12px;color:rgba(255,255,255,.7);letter-spacing:.4px}
.result .rv{font-family:var(--serif);font-size:27px;font-weight:700;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.result .rv small{font-size:15px;font-weight:600;opacity:.85}
.result .rsub{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:6px;line-height:1.4}
.calc-note{font-size:12.5px;color:var(--muted);margin-top:13px;line-height:1.5;border-top:1px solid var(--sky-line);padding-top:11px}

/* footer disclaimer */
.disc{margin-top:26px;font-size:11.5px;color:var(--muted-2);text-align:center;line-height:1.5;padding:0 8px}
.disc b{color:var(--muted)}

.hidden{display:none!important}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#view>*{animation:fade .22s ease}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand" onclick="goHome()">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M5 9h14M9 14h6M12 11v6"/><rect x="4" y="5" width="16" height="16" rx="3"/></svg>
      </div>
      <div>
        <h1>Catatan Klinis Anak</h1>
        <p>Referensi cepat PPDS &middot; offline</p>
      </div>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Cari obat, rumus, kondisi..." />
      <button class="clearq" id="clearq" aria-label="Hapus">&times;</button>
    </div>
  </div>
</header>
<main class="wrap"><div id="view"></div>
  <p class="disc"><b>Catatan Klinis Dokter Anak</b> &mdash; ringkasan pribadi untuk pembelajaran &amp; pengingat bedside. Selalu verifikasi dosis dengan protokol setempat, sediaan aktual, dan pertimbangan klinis. Sumber: catatan PPDS IKA.</p>
</main>
<script>
/* ============ ICONS ============ */
const IC = {
  nicu:'<path d="M9 18a3 3 0 0 0 6 0M12 2a4 4 0 0 0-4 4c0 2 1 3 1 5v3h6v-3c0-2 1-3 1-5a4 4 0 0 0-4-4Z"/>',
  picu:'<path d="M3 12h4l2-5 4 12 2-7h6"/>',
  hemato:'<path d="M12 2s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/>',
  kardio:'<path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1Z"/>',
  gastro:'<path d="M12 3v5M9 8c-3 1-5 3-5 7a5 5 0 0 0 10 0c0-2 1-3 3-3a2 2 0 0 1 0 4"/>',
  nutrisi:'<path d="M3 2v7c0 1.7 1.3 3 3 3s3-1.3 3-3V2M6 12v10M18 2c-2 0-3 3-3 6s1 4 3 4 3-1 3-4-1-6-3-6ZM18 12v10"/>',
  neuro:'<path d="M9.5 2A4.5 4.5 0 0 0 5 6.5c0 1-1 1.5-1 3 0 1 .5 1.5.5 2.5S4 14 4 15a3 3 0 0 0 5.5 1.7M9.5 2a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3"/>',
  respi:'<path d="M12 2v8M9 7c0-2.8-2-5-4.5-5C3 2 2 4 2 7c0 5 2.5 8 4.5 8 1.5 0 2.5-1.5 2.5-4M15 7c0-2.8 2-5 4.5-5C21 2 22 4 22 7c0 5-2.5 8-4.5 8-1.5 0-2.5-1.5-2.5-4"/>',
  endo:'<path d="M12 2a5 5 0 0 1 5 5c0 3-2 4-2 7v3H9v-3c0-3-2-4-2-7a5 5 0 0 1 5-5ZM9 21h6"/>',
  nefro:'<path d="M12 3C8 3 5 6 5 10c0 5 4 8 7 11 3-3 7-6 7-11 0-4-3-7-7-7Z"/><path d="M9 11c1.5-2 4.5-2 6 0"/>',
  infeksi:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  alergi:'<path d="M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5l-8-3Z"/><path d="m9 12 2 2 4-4"/>',
  pedsos:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 20c0-2 .8-3.8 2-5"/>'
};

/* ============ DATA ============ */
const DATA = [
/* 1 NICU */
{id:'nicu',name:'NICU',full:'Neonatal Intensive Care Unit',icon:'nicu',sec:[
  {t:'Heparin Flush — Pengenceran',b:[
    {p:'Tujuan: menjaga kepatenan jalur infus agar tidak tersumbat.'},
    {sub:'Larutan Heparin 10 unit/mL'},
    {list:['Ambil 0,1 mL heparin (konsentrasi 1000 unit/mL)','Tambahkan 9,9 mL NaCl 0,9%','Hasil: 10 mL larutan = 10 unit/mL (siap pakai)']}
  ]},
  {t:'Koreksi Bikarbonat (Bicnat / Meylon)',b:[
    {formula:'<b>0,3 × BE × BB</b> → habis dalam 24 jam'},
    {p:'Contoh: BB 2,1 kg, BE 6 → 0,3 × 6 × 2,1 = 3,78 mEq.'},
    {list:['Jika melalui CVC: encerkan 1:1 dengan D5%/D10%']},
    {formula:'Rumus alternatif NICU: <b>0,6 × BB × BE</b> dalam D10% (dikali 5) → habis 24 jam'}
  ]},
  {t:'Koreksi Hiponatremia',b:[
    {formula:'Rumus cepat: <b>6 mmol/kgBB</b> dilarutkan dalam <b>20 mL/kgBB</b> Dextrose 10%'},
    {list:['2 mL NaCl 3% = 1 mEq Natrium','Contoh: BB 2,115 kg → koreksi 6 × 2,115 = 12,69 mEq','Campur ±30 mL NaCl 3% dalam 40 mL D10% → habis dalam 6 jam']},
    {warn:'Koreksi Na cepat bisa pakai NaCl 3% via PICC. Koreksi JANGAN > 10 mEq/L per 24 jam.'}
  ]},
  {t:'Koreksi Hipoalbuminemia',b:[
    {formula:'<b>(Target Albumin − Albumin Sekarang) × 0,8 × 4 × BB</b>'},
    {list:['Plasbumin 25% → kalikan 4','Plasbumin 5% → kalikan 20']}
  ]},
  {t:'Koreksi Magnesium Sulfat 20%',b:[
    {list:['Sediaan MgSO4 20% = 200 mg/mL','Kebutuhan (gram) ÷ 200 = jumlah mL diberikan per 6 jam']}
  ]},
  {t:'Transfusi Darah & Komponen Darah',b:[
    {table:{head:['Komponen','Dosis','Durasi','Frekuensi'],rows:[
      ['PRC','20 mL/kgBB','Sesuai kondisi','1 kali'],
      ['FFP','15 mL/kgBB','Sesuai kondisi','1 kali'],
      ['TC (Trombosit)','15 mL/kgBB','Sesuai kondisi','3 hari']]}},
    {warn:'Transfusi berulang (≥2x) dapat menyebabkan hiperferritinemia → tunda Fe hingga usia 2 bulan, atau periksa ferritin dahulu.'}
  ]},
  {t:'Pemberian Zat Besi (Fe) — Prematur & BBLR',b:[
    {list:['Dosis: 3 mg/kgBB/hari oral','Mulai usia 1 bulan, KECUALI transfusi ≥2x → tunda hingga 2 bulan','Tanpa fasilitas cek ferritin: tunggu hingga 2 bulan agar ferritin menurun','Contoh BB 1,3 kg → Ferlin drops (15 mg Fe/mL), hitung sesuai BB']}
  ]},
  {t:'Vitamin & Suplemen Rutin',b:[
    {table:{head:['Obat','Dosis','Rute','Keterangan'],rows:[
      ['Zamel','1 mL/24 jam','Oral','Vitamin D'],
      ['Apyalis','0,6 mL/24 jam','Oral','Vit D (sesuai target kadar)'],
      ['Ferlin drops','0,3 mL/24 jam','Oral','Zat besi (mulai usia 1 bln)']]}},
    {sub:'Vitamin K'},
    {list:['Injeksi Vit K: 3 hari berturut-turut pada BBL','Tujuan: mencegah HDN (Hemorrhagic Disease of the Newborn)']},
    {sub:'Antikoagulan'},
    {list:['Clopidogrel (CPG): 0,2 mg/kgBB/hari']}
  ]},
  {t:'Nutrisi Neonatus — Kalori Susu / mL',b:[
    {table:{head:['Jenis Susu','Kalori/mL','Keterangan'],rows:[
      ['ASI','0,67 kkal','Standar 20'],
      ['Sufor BBLR','0,8 kkal','Standar 24, prematur'],
      ['Nutramigen','—','BBLR pasca operasi']]}},
    {list:['Kenaikan BB minimal: 15 g/kgBB/hari','GIR minimal: 4–6 mg/kgBB/menit']}
  ]},
  {t:'Menghitung GIR (Glucose Infusion Rate)',b:[
    {sub:'Dari Infus IV'},
    {formula:'Rumus 1: <b>[0,167 × Kecepatan(mL/jam) × %Dextrose] ÷ BB</b>'},
    {formula:'Rumus 2: <b>[Kecepatan(mL/jam) × %Dextrose] ÷ (6 × BB)</b>'},
    {sub:'Dari Minum Oral'},
    {formula:'<b>(Total minum 24 jam ÷ 24) × 7 (ASI) atau 8 (SF) ÷ BB ÷ 6</b>'}
  ]},
  {t:'Balance Cairan & IWL',b:[
    {formula:'IWL = <b>BB × 26</b> (dalam inkubator/modalitas) atau <b>BB × 20</b> (tanpa modalitas)'},
    {formula:'Balance = <b>Total masuk − Total keluar − IWL</b>'},
    {list:['Target balance: ±20 mL/kgBB/24 jam','< 20 mL/kgBB → risiko AKI','> 20 mL/kgBB → risiko overload cairan','Produksi urin normal: 1–3 mL/kgBB/jam (poliuria jika >3)']},
    {warn:'Untuk menghitung kebutuhan cairan & minum, gunakan berat badan TERBERAT yang pernah tercatat.'}
  ]},
  {t:'Kurva Pertumbuhan Bayi',b:[
    {table:{head:['Kondisi','Kurva'],rows:[
      ['Prematur < 40 minggu','Fenton (plot tiap minggu)'],
      ['≥ 40 mgg / BBLR / 0–2 bln','WHO Z-score 0–2 bln (per minggu)'],

function fmt(n,d){ if(!isFinite(n)) return '–'; d=(d==null?2:d); let r=Math.round(n*Math.pow(10,d))/Math.pow(10,d); return String(r).replace('.',','); }

  fn:v=>{let g=(v.rate*v.conc)/(6*v.bb); return {v:fmt(g),u:'mg/kgBB/menit',s:'Rumus: (kecepatan × %dextrose) ÷ (6 × BB). Target neonatus ≥ 4–6.'};}},

 {id:'rumatan',cat:'NICU & Cairan',ab:'💧',name:'Cairan Rumatan (Holliday-Segar)',desc:'Metode berat badan 100/50/20',

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}

/* ---- block renderer ---- */
function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b.sub) return '<div class="sub">'+esc(b.sub)+'</div>';
    if(b.p) return '<p class="txt blk">'+esc(b.p)+'</p>';
    if(b.note) return '<div class="note">'+esc(b.note)+'</div>';
    if(b.formula) return '<div class="formula blk">'+b.formula+'</div>';
    if(b.warn) return '<div class="warn blk">'+esc(b.warn)+'</div>';
    if(b.list) return '<ul class="lst blk">'+b.list.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';
    if(b.table){
      let h='<div class="tw blk"><table><thead><tr>'+b.table.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';
      h+=b.table.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('');
      return h+'</tbody></table></div>';
    }
    return '';
  }).join('');
}
function blockText(blocks){
  let t=[];
  blocks.forEach(b=>{
    if(b.sub)t.push(b.sub); if(b.p)t.push(b.p); if(b.note)t.push(b.note);
    if(b.formula)t.push(b.formula.replace(/<[^>]+>/g,'')); if(b.warn)t.push(b.warn);
    if(b.list)t.push(b.list.join(' '));
    if(b.table){t.push(b.table.head.join(' '));b.table.rows.forEach(r=>t.push(r.join(' ')));}
  });
  return t.join(' ');
}

/* ---- DIVISION ---- */
function renderDivision(id,openIndex){
  const d=DATA.find(x=>x.id===id); if(!d)return goHome();
  const idx=DATA.indexOf(d)+1;
  const oi=(openIndex==null?0:openIndex);
  let h='<button class="back" onclick="goHome()">'+arrL+'Beranda</button>';
  h+='<div class="dhead"><span class="tag">Divisi '+idx+'</span><h2>'+esc(d.name)+'</h2><p class="full">'+esc(d.full)+'</p></div>';
  d.sec.forEach((s,i)=>{
    h+='<div class="sec'+(i===oi?' open':'')+'" data-i="'+i+'"><div class="sec-h" onclick="toggleSec(this)">'+
       '<span class="dot"></span><h4>'+esc(s.t)+'</h4><span class="chev">'+chevD+'</span></div>'+
       '<div class="sec-b">'+renderBlocks(s.b)+'</div></div>';
  });
  view.innerHTML=h;
  window.scrollTo(0,0);
  if(openIndex!=null){ const tgt=view.querySelector('.sec[data-i="'+openIndex+'"]');
    if(tgt) setTimeout(()=>tgt.scrollIntoView({behavior:'smooth',block:'center'}),80); }
}
function toggleSec(el){ el.parentElement.classList.toggle('open'); }

/* ---- SEARCH ---- */
let INDEX=[];
DATA.forEach(d=>d.sec.forEach((s,si)=>INDEX.push({div:d.name,divId:d.id,si:si,title:s.t,body:blockText(s.b)})));
function hl(text,terms){
  let t=esc(text);
  terms.forEach(w=>{ if(w.length<2)return; t=t.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); });
  return t;
}
function renderSearch(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const res=INDEX.map(it=>{
    const hay=(it.title+' '+it.div+' '+it.body).toLowerCase();
    let score=0; terms.forEach(w=>{ if(it.title.toLowerCase().includes(w))score+=5; else if(hay.includes(w))score+=1; });
    return {it,score};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score);
  let h='';
  if(!res.length){ h='<div class="empty">'+svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>')+'<div>Tidak ada hasil untuk &ldquo;'+esc(q)+'&rdquo;.</div></div>'; view.innerHTML=h; return; }
  h+='<div class="rescount">'+res.length+' hasil untuk &ldquo;'+esc(q)+'&rdquo;</div>';
  res.slice(0,40).forEach(r=>{
    let snippet=r.it.body.slice(0,140);
    h+='<div class="rescard" onclick="goDivision(\''+r.it.divId+'\','+r.it.si+')">'+
       '<div class="d">'+esc(r.it.div)+'</div><h4>'+hl(r.it.title,terms)+'</h4>'+
       '<p>'+hl(snippet,terms)+'…</p></div>';
  });
  view.innerHTML=h;
}

    CALC.filter(c=>c.cat===cat).forEach(c=>{
      h+='<div class="calc-li" onclick="goCalcOne(\''+c.id+'\')"><div class="ci">'+esc(c.ab)+'</div>'+
         '<div><h4>'+esc(c.name)+'</h4><p>'+esc(c.desc)+'</p></div><div class="arr">'+arrR+'</div></div>';
    });
  });
  view.innerHTML=h; window.scrollTo(0,0);
}

/* ---- CALC DETAIL ---- */
function renderCalc(id){
  const c=CALC.find(x=>x.id===id); if(!c)return renderCalcList();
  let h='<button class="back" onclick="goCalc()">'+arrL+'Semua kalkulator</button>';
  h+='<div class="calc-card"><h3>'+esc(c.name)+'</h3><p class="desc">'+esc(c.desc)+'</p>';
  c.in.forEach(f=>{
    h+='<div class="field"><label>'+esc(f.l)+(f.u?' <span class="unit">('+esc(f.u)+')</span>':'')+'</label>';
    if(f.type==='sel'){
      h+='<select data-f="'+f.id+'" oninput="runCalc(\''+c.id+'\')">'+f.opts.map(o=>'<option value="'+o.v+'"'+(o.v===f.v?' selected':'')+'>'+esc(o.l)+'</option>').join('')+'</select>';
    } else {
      h+='<input type="number" inputmode="decimal" step="any" data-f="'+f.id+'" value="'+(f.v!=null?f.v:'')+'" placeholder="0" oninput="runCalc(\''+c.id+'\')">';
    }
    h+='</div>';
  });
  h+='<div class="result" id="cres"><div class="rl">Hasil</div><div class="rv">–</div><div class="rsub">Lengkapi nilai di atas.</div></div>';
  h+='<div class="calc-note">Verifikasi selalu dengan sediaan aktual, pengenceran, dan protokol setempat.</div></div>';
  view.innerHTML=h; window.scrollTo(0,0);
  runCalc(id);
}
function runCalc(id){
  const c=CALC.find(x=>x.id===id);
  let v={},ok=true;
  c.in.forEach(f=>{
    const el=view.querySelector('[data-f="'+f.id+'"]');
    let val=el?el.value:'';
    if(val===''||val==null){ if(f.type!=='sel')ok=false; v[f.id]=0; }
    else v[f.id]=parseFloat(val);
  });
  const box=document.getElementById('cres');
  if(!ok){ box.innerHTML='<div class="rl">Hasil</div><div class="rv">–</div><div class="rsub">Lengkapi nilai di atas.</div>'; return; }
  let r=c.fn(v);
  box.innerHTML='<div class="rl">Hasil</div><div class="rv">'+r.v+' <small>'+esc(r.u)+'</small></div><div class="rsub">'+esc(r.s)+'</div>';
}

/* ---- NAV ---- */
function goHome(){ state={v:'home'}; qEl.value=''; toggleClear(); renderHome(); window.scrollTo(0,0); }
function goDivision(id,openIndex){
  state={v:'division',div:id}; qEl.value=''; toggleClear(); renderDivision(id,openIndex);
}
function goCalc(){ state={v:'calc-list'}; qEl.value=''; toggleClear(); renderCalcList(); }
function goCalcOne(id){ state={v:'calc',calc:id}; renderCalc(id); }

function toggleClear(){ clearBtn.classList.toggle('show', qEl.value.length>0); }
qEl.addEventListener('input',()=>{
  toggleClear();
  const q=qEl.value.trim();
  if(q.length===0){ if(state.v==='search'){goHome();} return; }
  if(q.length>=2){ state={v:'search'}; renderSearch(q); }
});
clearBtn.addEventListener('click',()=>{ qEl.value=''; toggleClear(); goHome(); qEl.focus(); });

/* init */
renderHome();
</script>
</body>
</html>
